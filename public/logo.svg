<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="360" height="140">
  <defs>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- AL letters -->
  <text x="10" y="75" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900"
        font-size="80" fill="#1e3a8a" letter-spacing="-2">AL</text>

  <!-- Swoosh wave under AL -->
  <path d="M 8 85 C 40 70, 80 62, 130 72 C 170 80, 200 88, 230 78 C 250 72, 265 65, 280 58"
        stroke="url(#swooshGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 8 93 C 45 78, 90 70, 140 82 C 180 90, 210 98, 248 86 C 265 80, 278 73, 290 66"
        stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Decorative dots (air bubbles) upper right -->
  <circle cx="295" cy="18" r="5" fill="#2563eb"/>
  <circle cx="310" cy="10" r="3.5" fill="#3b82f6"/>
  <circle cx="320" cy="22" r="4" fill="#60a5fa"/>
  <circle cx="302" cy="32" r="2.5" fill="#93c5fd"/>
  <circle cx="316" cy="36" r="3" fill="#3b82f6"/>
  <circle cx="328" cy="14" r="2" fill="#93c5fd"/>

  <!-- AIR DUCT CLEANING text -->
  <text x="10" y="115" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900"
        font-size="22" fill="#1e3a8a" letter-spacing="1.5">AIR DUCT CLEANING</text>

  <!-- SALT LAKE CITY text -->
  <text x="10" y="135" font-family="'Arial', sans-serif" font-weight="700"
        font-size="16" fill="#2563eb" letter-spacing="2">SALT LAKE CITY</text>
</svg>